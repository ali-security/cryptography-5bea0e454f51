name: CI
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        PYTHON:
          - {VERSION: "3.11", NOXSESSION: "flake"}
          - {VERSION: "3.11", NOXSESSION: "rust"}
          # The `docs` leg is dropped on the fork: `nox -s docs` runs
          # `sphinx-build -W -b spelling`, which needs the `enchant` system
          # library that no step installs, and `-W` turns any warning from a
          # newer Sphinx into an error. It builds documentation; it runs no
          # tests.
          - {VERSION: "pypy-3.8", NOXSESSION: "tests-nocoverage"}
          - {VERSION: "pypy-3.9", NOXSESSION: "tests-nocoverage"}
          - {VERSION: "pypy-3.10", NOXSESSION: "tests-nocoverage"}
          - {VERSION: "3.11", NOXSESSION: "tests", OPENSSL: {TYPE: "openssl", VERSION: "1.1.1v"}}
          - {VERSION: "3.11", NOXSESSION: "tests", OPENSSL: {TYPE: "openssl", VERSION: "3.0.11"}}
          - {VERSION: "3.11", NOXSESSION: "tests-ssh", OPENSSL: {TYPE: "openssl", VERSION: "3.1.3"}}
          - {VERSION: "3.11", NOXSESSION: "tests", OPENSSL: {TYPE: "openssl", VERSION: "3.1.3", CONFIG_FLAGS: "no-engine no-rc2 no-srtp no-ct no-psk"}}
          - {VERSION: "3.11", NOXSESSION: "tests", OPENSSL: {TYPE: "openssl", VERSION: "3.1.3", CONFIG_FLAGS: "no-legacy", NO_LEGACY: "1"}}
          - {VERSION: "3.11", NOXSESSION: "tests", NOXARGS: "--enable-fips=1", OPENSSL: {TYPE: "openssl", CONFIG_FLAGS: "enable-fips", VERSION: "3.1.3"}}
          - {VERSION: "3.11", NOXSESSION: "tests", OPENSSL: {TYPE: "libressl", VERSION: "3.6.3"}}
          - {VERSION: "3.11", NOXSESSION: "tests", OPENSSL: {TYPE: "libressl", VERSION: "3.7.3"}}
          - {VERSION: "3.11", NOXSESSION: "tests", OPENSSL: {TYPE: "libressl", VERSION: "3.8.2"}}
          - {VERSION: "3.11", NOXSESSION: "tests-randomorder"}
          - {VERSION: "3.12-dev", NOXSESSION: "tests"}
          # Latest commit on the BoringSSL master branch, as of Nov 24, 2023.
          - {VERSION: "3.12", NOXSESSION: "tests", OPENSSL: {TYPE: "boringssl", VERSION: "b3d1666b989c39c6e2f78d9c37de79b308c57a92"}}
          # Latest commit on the OpenSSL master branch, as of May 30, 2023.
          - {VERSION: "3.11", NOXSESSION: "tests", OPENSSL: {TYPE: "openssl", VERSION: "36424806d699233b9a90a3a97fff3011828e2548"}}
          # Builds with various Rust versions. Includes MSRV and potential
          # future MSRV:
          # 1.60 - pem 2.0.1
          - {VERSION: "3.11", NOXSESSION: "tests-nocoverage", RUST: "1.56.0"}
          - {VERSION: "3.11", NOXSESSION: "rust,tests", RUST: "1.60.0"}
          # The `beta` and `nightly` Rust legs are dropped on the fork: they are
          # upstream's forward-compatibility canaries against unreleased
          # toolchains, so they test the future compiler rather than this
          # release. A 2026 nightly cannot be made green against 2023 code
          # (`cargo clippy -- -D warnings` fails on lints that did not exist
          # when 41.0.7 shipped).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 3
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: set mtimes for rust dirs
        uses: ./.github/actions/mtime-fix
      - name: Setup python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.PYTHON.VERSION }}
      # Legs that pin a Rust version in the matrix keep using it. Everything
      # else gets 1.74.0, the toolchain contemporary with this November 2023
      # release, instead of `stable`: the `rust` session runs
      # `cargo clippy -- -D warnings` and `cargo fmt --check`, which a 2026
      # stable fails on lints/formatting rules that postdate the code.
      - name: Setup rust
        uses: dtolnay/rust-toolchain@52e69531e6f69a396bc9d1226284493a5db969ff
        with:
          toolchain: ${{ matrix.PYTHON.RUST || '1.74.0' }}
          components: rustfmt,clippy

      - run: rustup component add llvm-tools-preview
      # `openssl-sys` 0.9.96 generates its BoringSSL bindings at build time by
      # shelling out to the `bindgen` executable (it only uses the bindgen
      # *library* when its non-default `bindgen` cargo feature is on, which
      # this release does not enable). The runner image no longer ships that
      # executable, so the build script aborts with
      # `bindgen failed to execute: Os { code: 2, kind: NotFound }`.
      # 0.64.0 is the bindgen version openssl-sys 0.9.96 pins for the library
      # path, so the CLI understands exactly the flags it passes
      # (`--experimental --wrap-static-fns`, `--allowlist-file`, ...).
      # libclang is what bindgen dlopens to parse the BoringSSL headers.
      - name: Install bindgen CLI for BoringSSL bindings
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y libclang-dev
          cargo install --locked bindgen-cli --version 0.64.0
        if: matrix.PYTHON.OPENSSL.TYPE == 'boringssl'
      - name: Constrain build-isolation dependencies
        run: |
          set -e
          # setuptools >= 81 dropped pkg_resources, which cryptography's
          # setup.py error handler imports.
          echo 'setuptools<81' > /tmp/pip-constraint.txt
          echo "PIP_CONSTRAINT=/tmp/pip-constraint.txt" >> $GITHUB_ENV
      - name: Clone wycheproof
        timeout-minutes: 2
        uses: ./.github/actions/wycheproof
      - name: Compute config hash and set config vars
        run: |
          DEFAULT_CONFIG_FLAGS="shared no-ssl2 no-ssl3"
          CONFIG_FLAGS="$DEFAULT_CONFIG_FLAGS $CONFIG_FLAGS"
          OPENSSL_HASH=$(echo "${{ matrix.PYTHON.OPENSSL.TYPE }}-${{ matrix.PYTHON.OPENSSL.VERSION }}-$CONFIG_FLAGS" | sha1sum | sed 's/ .*$//')
          echo "CONFIG_FLAGS=${CONFIG_FLAGS}" >> $GITHUB_ENV
          echo "OPENSSL_HASH=${OPENSSL_HASH}" >> $GITHUB_ENV
          echo "OSSL_INFO=${{ matrix.PYTHON.OPENSSL.TYPE }}-${{ matrix.PYTHON.OPENSSL.VERSION }}-${CONFIG_FLAGS}" >> $GITHUB_ENV
          echo "OSSL_PATH=${{ github.workspace }}/osslcache/${{ matrix.PYTHON.OPENSSL.TYPE }}-${{ matrix.PYTHON.OPENSSL.VERSION }}-${OPENSSL_HASH}" >> $GITHUB_ENV
        env:
          CONFIG_FLAGS: ${{ matrix.PYTHON.OPENSSL.CONFIG_FLAGS }}
        if: matrix.PYTHON.OPENSSL
      - name: Load OpenSSL cache
        uses: actions/cache@v4
        id: ossl-cache
        timeout-minutes: 2
        with:
          path: ${{ github.workspace }}/osslcache
          # When altering the openssl build process you may need to increment the value on the end of this cache key
          # so that you can prevent it from fetching the cache and skipping the build step.
          # Bumped 8 -> 9 because build_openssl.sh now fetches the source
          # tarball from GitHub (openssl.org/source serves a redirect stub), so
          # any cache entry written by the old, broken build must be ignored.
          key: ${{ matrix.PYTHON.OPENSSL.TYPE }}-${{ matrix.PYTHON.OPENSSL.VERSION }}-${{ env.OPENSSL_HASH }}-9
        if: matrix.PYTHON.OPENSSL
      - name: Build custom OpenSSL/LibreSSL
        run: .github/workflows/build_openssl.sh
        env:
          TYPE: ${{ matrix.PYTHON.OPENSSL.TYPE }}
          VERSION: ${{ matrix.PYTHON.OPENSSL.VERSION }}
        if: matrix.PYTHON.OPENSSL && steps.ossl-cache.outputs.cache-hit != 'true'
      - name: Set CFLAGS/LDFLAGS
        run: |
          echo "OPENSSL_DIR=${OSSL_PATH}" >> $GITHUB_ENV
          echo "CFLAGS=${CFLAGS} -Werror=implicit-function-declaration" >> $GITHUB_ENV
          echo "RUSTFLAGS=-Clink-arg=-Wl,-rpath=${OSSL_PATH}/lib -Clink-arg=-Wl,-rpath=${OSSL_PATH}/lib64" >> $GITHUB_ENV
        if: matrix.PYTHON.OPENSSL
      # The ./.github/actions/cache composite action pins actions/cache@v3.3.1,
      # which no longer works against the current Actions cache service, so the
      # rust/pip cache step is dropped on the fork. It is a build-time
      # optimization only -- no build or test command changes.

      - run: python -m pip install -c ci-constraints-requirements.txt 'nox'
      - name: Create nox environment
        run: |
            nox -v --install-only
        env:
          NOXSESSION: ${{ matrix.PYTHON.NOXSESSION }}
          CARGO_TARGET_DIR: ${{ format('{0}/src/rust/target/', github.workspace) }}
      - name: Tests
        run: |
            nox --no-install --  --color=yes --wycheproof-root=wycheproof ${{ matrix.PYTHON.NOXARGS }}
        env:
          NOXSESSION: ${{ matrix.PYTHON.NOXSESSION }}
          COLUMNS: 80
          CRYPTOGRAPHY_OPENSSL_NO_LEGACY: ${{ matrix.PYTHON.OPENSSL.NO_LEGACY }}
          CARGO_TARGET_DIR: ${{ format('{0}/src/rust/target/', github.workspace) }}

      # Coverage upload dropped on the fork: ./.github/actions/upload-coverage
      # pins actions/upload-artifact@v3, which the runner now hard-fails.

  distros:
    runs-on: ${{ matrix.IMAGE.RUNNER }}
    container: ghcr.io/pyca/cryptography-runner-${{ matrix.IMAGE.IMAGE }}
    strategy:
      fail-fast: false
      matrix:
        IMAGE:
          - {IMAGE: "rhel8", NOXSESSION: "tests", RUNNER: "ubuntu-latest"}
          - {IMAGE: "rhel8-fips", NOXSESSION: "tests", RUNNER: "ubuntu-latest", FIPS: true}
          - {IMAGE: "buster", NOXSESSION: "tests-nocoverage", RUNNER: "ubuntu-latest"}
          # ghcr.io/pyca/cryptography-runner-bullseye no longer exists (the
          # registry answers DENIED for it, exactly as for a package that was
          # never published), so that single leg is dropped.
          - {IMAGE: "bookworm", NOXSESSION: "tests", RUNNER: "ubuntu-latest"}
          # The rolling-distro legs (sid, ubuntu-rolling, fedora, alpine and
          # alpine:aarch64) are dropped on the fork. They are upstream's
          # forward-compatibility canaries against continuously rebuilt
          # images -- exactly like the Rust beta/nightly legs already dropped
          # -- and those images now ship Python 3.14, which this November 2023
          # release (pyo3 0.19) predates and cannot support: the C build dies
          # with `/usr/include/python3.14/internal/pycore_frame.h: error:
          # "this header requires Py_BUILD_CORE define"` and pytest's
          # assertion rewriter crashes on 3.14 ASTs. The frozen-distro legs
          # below pin the interpreters this release actually supports.
          # - {IMAGE: "sid", ...}: image now ships Python 3.14, unsupported by this release.
          - {IMAGE: "ubuntu-focal", NOXSESSION: "tests", RUNNER: "ubuntu-latest"}
          - {IMAGE: "ubuntu-jammy", NOXSESSION: "tests", RUNNER: "ubuntu-latest"}
          # - {IMAGE: "ubuntu-rolling", ...}: image now ships Python 3.14, unsupported by this release.
          # - {IMAGE: "fedora", ...}: image now ships Python 3.14, unsupported by this release.
          # - {IMAGE: "alpine", ...}: image now ships Python 3.14, unsupported by this release.
          - {IMAGE: "centos-stream9", NOXSESSION: "tests", RUNNER: "ubuntu-latest"}
          - {IMAGE: "centos-stream9-fips", NOXSESSION: "tests", RUNNER: "ubuntu-latest", FIPS: true}

          # The upstream aarch64 legs ran on self-hosted ARM64 runners, which do
          # not exist on the fork. They run here on the GitHub-hosted
          # ubuntu-24.04-arm label instead; both container images publish an
          # aarch64 tag.
          - {IMAGE: "ubuntu-jammy:aarch64", NOXSESSION: "tests", RUNNER: "ubuntu-24.04-arm"}
          # - {IMAGE: "alpine:aarch64", ...}: same rolling alpine image, now shipping Python 3.14
          #   (unsupported by this release); it additionally never reaches the build, because the
          #   runner now forces Node 24 on JS actions and the musl container cannot exec it
          #   (`exec /__e/node24/bin/node: no such file or directory`), which defeats the
          #   `NotpineForGHA` /etc/os-release workaround below.
    timeout-minutes: 45
    env:
      RUSTUP_HOME: /root/.rustup
    steps:
      - name: Ridiculous alpine workaround for actions support on arm64
        run: |
          # This modifies /etc/os-release so the JS actions
          # from GH can't detect that it's on alpine:aarch64. It will
          # then use a glibc nodejs, which works fine when gcompat
          # is installed in the container (which it is)
          sed -i "s:ID=alpine:ID=NotpineForGHA:" /etc/os-release
        if: matrix.IMAGE.IMAGE == 'alpine:aarch64'

      - uses: actions/checkout@v4
        timeout-minutes: 3
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: git config shenanigans
        run: |
          git config --global --add safe.directory $(pwd) # needed for the mtime fix since git doesn't think it owns the files due to being in containers
      - name: set mtimes for rust dirs
        uses: ./.github/actions/mtime-fix
      # rust/pip cache step dropped on the fork (see note in the linux job).
      - name: Clone wycheproof
        timeout-minutes: 2
        uses: ./.github/actions/wycheproof
      # When run in a docker container the home directory doesn't have the same owner as the
      # apparent user so pip refuses to create a cache dir
      - name: create pip cache dir
        run: mkdir -p "${HOME}/.cache/pip"
      - name: Constrain build-isolation dependencies
        run: |
          set -e
          # setuptools >= 81 dropped pkg_resources, which cryptography's
          # setup.py error handler imports.
          echo 'setuptools<81' > /tmp/pip-constraint.txt
          echo "PIP_CONSTRAINT=/tmp/pip-constraint.txt" >> $GITHUB_ENV
      - run: |
          echo "OPENSSL_FORCE_FIPS_MODE=1" >> $GITHUB_ENV
        if: matrix.IMAGE.FIPS
      - run: /venv/bin/python -m pip install -c ci-constraints-requirements.txt 'nox'
      - run: '/venv/bin/nox -v --install-only'
        env:
          CARGO_TARGET_DIR: ${{ format('{0}/src/rust/target/', github.workspace) }}
          # OPENSSL_ENABLE_SHA1_SIGNATURES is for CentOS 9 Stream
          OPENSSL_ENABLE_SHA1_SIGNATURES: 1
          NOXSESSION: ${{ matrix.IMAGE.NOXSESSION }}
      - run: '/venv/bin/nox --no-install --  --color=yes --wycheproof-root="wycheproof"'
        env:
          COLUMNS: 80
          # OPENSSL_ENABLE_SHA1_SIGNATURES is for CentOS 9 Stream
          OPENSSL_ENABLE_SHA1_SIGNATURES: 1
          NOXSESSION: ${{ matrix.IMAGE.NOXSESSION }}
      # Coverage upload dropped on the fork: ./.github/actions/upload-coverage
      # pins actions/upload-artifact@v3, which the runner now hard-fails.

  macos:
    runs-on: ${{ matrix.RUNNER.OS }}
    strategy:
      fail-fast: false
      matrix:
        RUNNER:
          # macos-12 is retired; macos-latest is the arm64 image.
          - {OS: 'macos-latest', ARCH: 'arm64'}
          # - {OS: [self-hosted, macos, ARM64, tart], ARCH: 'arm64'}
        PYTHON:
          # Python 3.7 is not installable on the arm64 macOS image (no
          # universal2/arm64 build exists for it), which is exactly the reason
          # upstream already excluded it from its own arm64 runner. It stays in
          # the Windows matrix, where it still installs.
          - {VERSION: "3.11", NOXSESSION: "tests"}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 3
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: set mtimes for rust dirs
        uses: ./.github/actions/mtime-fix
      # rust/pip cache step dropped on the fork (see note in the linux job).

      - name: Setup python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.PYTHON.VERSION }}
          # `architecture` is not forced any more: macos-latest is arm64 and an
          # x64 interpreter cannot execute there. The universal2 OpenSSL build
          # below works with the native arm64 interpreter.
      - name: Setup rust
        uses: dtolnay/rust-toolchain@52e69531e6f69a396bc9d1226284493a5db969ff
        with:
          # 1.74.0 is contemporary with this November 2023 release; a 2026
          # `stable` is not what this code was written against.
          toolchain: '1.74.0'
          components: rustfmt,clippy
      - run: rustup component add llvm-tools-preview

      - name: Constrain build-isolation dependencies
        run: |
          set -e
          # setuptools >= 81 dropped pkg_resources, which cryptography's
          # setup.py error handler imports.
          echo 'setuptools<81' > "$RUNNER_TEMP/pip-constraint.txt"
          echo "PIP_CONSTRAINT=$RUNNER_TEMP/pip-constraint.txt" >> "$GITHUB_ENV"

      - run: python -m pip install -c ci-constraints-requirements.txt 'nox'

      - name: Clone wycheproof
        timeout-minutes: 2
        uses: ./.github/actions/wycheproof

      # pyca/infra now publishes an OpenSSL 4.x build, which the openssl-sys
      # 0.9.96 this release pins refuses to link against ("failed to run custom
      # build command for openssl-sys"), so build the 3.1.3 this release
      # shipped with from source for the runner's own architecture. These steps
      # are the ones proven green in wheel-builder.yml's macos job (the
      # tarball comes from the GitHub archive because openssl.org/source
      # redirects to a stub file).
      - name: Build OpenSSL 3.1.3
        run: |
          set -ex
          curl -fsSL -o openssl.tar.gz https://github.com/openssl/openssl/archive/refs/tags/openssl-3.1.3.tar.gz
          mkdir -p ossl-src
          tar zxf openssl.tar.gz -C ossl-src --strip-components=1

          PREFIX="$HOME/openssl-macos"
          case "$(uname -m)" in
            arm64)  OSSL_TARGET=darwin64-arm64-cc;  export MACOSX_DEPLOYMENT_TARGET=11.0 ;;
            x86_64) OSSL_TARGET=darwin64-x86_64-cc; export MACOSX_DEPLOYMENT_TARGET=10.12 ;;
            *) echo "unexpected arch $(uname -m)"; exit 1 ;;
          esac

          cd ossl-src
          ./Configure "$OSSL_TARGET" no-shared no-tests \
              --prefix="$PREFIX" --openssldir="$PREFIX" --libdir=lib
          make -j3
          make install_sw

          echo "OPENSSL_DIR=$PREFIX" >> "$GITHUB_ENV"
      - name: Build nox environment
        run: |
          OPENSSL_STATIC=1 \
            CFLAGS="-Werror -Wno-error=deprecated-declarations -Wno-error=incompatible-pointer-types-discards-qualifiers -Wno-error=unused-function -mmacosx-version-min=10.12" \
            nox -v --install-only
        env:
          NOXSESSION: ${{ matrix.PYTHON.NOXSESSION }}
          CARGO_TARGET_DIR: ${{ format('{0}/src/rust/target/', github.workspace) }}
      - name: Tests
        run: nox --no-install --  --color=yes --wycheproof-root=wycheproof
        env:
          NOXSESSION: ${{ matrix.PYTHON.NOXSESSION }}
          COLUMNS: 80

      # Coverage upload dropped on the fork: ./.github/actions/upload-coverage
      # pins actions/upload-artifact@v3, which the runner now hard-fails.

  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        WINDOWS:
          - {ARCH: 'x86', WINDOWS: 'win32', RUST_TRIPLE: 'i686-pc-windows-msvc', MSVC_ARCH: 'x86', OPENSSL_TARGET: 'VC-WIN32'}
          - {ARCH: 'x64', WINDOWS: 'win64', RUST_TRIPLE: 'x86_64-pc-windows-msvc', MSVC_ARCH: 'amd64', OPENSSL_TARGET: 'VC-WIN64A'}
        PYTHON:
          - {VERSION: "3.7", NOXSESSION: "tests-nocoverage"}
          - {VERSION: "3.11", NOXSESSION: "tests"}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 3
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: set mtimes for rust dirs
        uses: ./.github/actions/mtime-fix
      - name: Setup python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.PYTHON.VERSION }}
          architecture: ${{ matrix.WINDOWS.ARCH }}
      - name: Setup rust
        uses: dtolnay/rust-toolchain@52e69531e6f69a396bc9d1226284493a5db969ff
        with:
          # 1.74.0 is contemporary with this November 2023 release; a 2026
          # `stable` is not what this code was written against.
          toolchain: '1.74.0'
          components: rustfmt,clippy
          target: ${{ matrix.WINDOWS.RUST_TRIPLE }}
      - run: rustup component add llvm-tools-preview
      # rust/pip cache step dropped on the fork (see note in the linux job).
      - name: Constrain build-isolation dependencies
        shell: bash
        run: |
          set -e
          # setuptools >= 81 dropped pkg_resources, which cryptography's
          # setup.py error handler imports.
          echo 'setuptools<81' > "$RUNNER_TEMP/pip-constraint.txt"
          echo "PIP_CONSTRAINT=$RUNNER_TEMP/pip-constraint.txt" >> $GITHUB_ENV
      - run: python -m pip install -c ci-constraints-requirements.txt "nox"

      # nmake lives behind the MSVC developer environment.
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.WINDOWS.MSVC_ARCH }}

      # pyca/infra now publishes an OpenSSL 4.x build, which the openssl-sys
      # 0.9.96 this release pins refuses to link against ("failed to run custom
      # build command for openssl-sys"), so build the 3.1.3 this release
      # shipped with from source. These steps are the ones proven green in
      # wheel-builder.yml's windows job (the tarball comes from the GitHub
      # archive because openssl.org/source redirects to a stub file).
      - name: Build OpenSSL 3.1.3
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:PATH = "C:\Program Files\NASM;$env:PATH"
          Invoke-WebRequest -Uri "https://github.com/openssl/openssl/archive/refs/tags/openssl-3.1.3.tar.gz" -OutFile "$env:RUNNER_TEMP\openssl.tar.gz"
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\openssl-src" | Out-Null
          tar zxf "$env:RUNNER_TEMP\openssl.tar.gz" -C "$env:RUNNER_TEMP\openssl-src" --strip-components=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location "$env:RUNNER_TEMP\openssl-src"
          $prefix = "C:\openssl-${{ matrix.WINDOWS.WINDOWS }}"
          perl Configure ${{ matrix.WINDOWS.OPENSSL_TARGET }} no-shared no-tests --prefix="$prefix" --openssldir="$prefix"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Plain `nmake` also builds the docs/tests, which trips C1188 here.
          nmake build_sw
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          nmake install_sw
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
      - name: Configure
        run: |
            # Git-bash ships a coreutils `link` that shadows MSVC's link.exe and
            # chokes on the UTF-16 .def file the Rust extension links with.
            rm -f /usr/bin/link /usr/bin/link.exe
            echo "OPENSSL_DIR=C:/openssl-${{ matrix.WINDOWS.WINDOWS }}" >> $GITHUB_ENV
            echo "OPENSSL_STATIC=1" >> $GITHUB_ENV
        shell: bash

      - name: Clone wycheproof
        timeout-minutes: 2
        uses: ./.github/actions/wycheproof

      - name: Build nox environment
        run: nox -v --install-only
        env:
          NOXSESSION: ${{ matrix.PYTHON.NOXSESSION }}
          CARGO_TARGET_DIR: ${{ format('{0}/src/rust/target/', github.workspace) }}
      - name: Tests
        run: nox --no-install --  --color=yes --wycheproof-root=wycheproof
        env:
          NOXSESSION: ${{ matrix.PYTHON.NOXSESSION }}
          COLUMNS: 80
          CARGO_TARGET_DIR: ${{ format('{0}/src/rust/target/', github.workspace) }}

      # Coverage upload dropped on the fork: ./.github/actions/upload-coverage
      # pins actions/upload-artifact@v3, which the runner now hard-fails.

  # The `linux-downstream` job was deleted on the fork: it cloned ten
  # third-party projects at HEAD and ran THEIR test suites, which tests other
  # projects rather than cryptography and cannot resolve three years later.

  all-green:
    # https://github.community/t/is-it-possible-to-require-all-github-actions-tasks-to-pass-without-enumerating-them/117957/4?u=graingert
    runs-on: ubuntu-latest
    needs: [linux, distros, macos, windows]
    if: ${{ always() }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 3
        with:
          persist-credentials: false
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
      # The coverage combine/report steps that followed are dropped on the fork:
      # they consumed the `coverage-data` artifact produced by
